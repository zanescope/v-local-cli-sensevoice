name: Release candidate

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package Windows amd64 candidate
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 配置 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: 构建候选 ZIP
        shell: pwsh
        run: ./scripts/package.ps1
      - name: 验证候选 ZIP 内容
        shell: pwsh
        run: |
          $archive = Get-ChildItem dist -Filter '*.zip' -File | Select-Object -Single
          $expanded = Join-Path $env:RUNNER_TEMP 'sensevoice-candidate'
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $expanded
          foreach ($name in @(
            'v-local-cli-sensevoice.exe', 'onnxruntime.dll', 'sherpa-onnx-c-api.dll',
            'sherpa-onnx-cxx-api.dll', 'LICENSE', 'THIRD_PARTY_NOTICES.md',
            'THIRD_PARTY-LICENSE-Apache-2.0.txt', 'MODEL_SOURCES.md', 'checksums.txt', 'manifest.json'
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $expanded $name) -PathType Leaf)) { throw "候选 ZIP 缺少 $name" }
          }
      - name: 为候选发布件生成 GitHub 来源证明
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            dist/*.zip
            dist/checksums.txt
      - name: 保存候选发布件
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v-local-cli-sensevoice-release-candidate
          path: |
            dist/*.zip
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 14
