name: Signed release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Sign and publish Windows amd64
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 配置 Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: 验证标签版本
        shell: pwsh
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Git 标签 $env:GITHUB_REF_NAME 与 VERSION $version 不一致" }
      - name: 导入 Authenticode 证书
        id: certificate
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_BASE64)) { throw '缺少 Windows 签名证书' }
          $path = Join-Path $env:RUNNER_TEMP 'windows-signing.pfx'
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:SIGNING_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $certificate.Thumbprint) { throw 'Windows 签名证书导入失败' }
          "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
      - name: 构建签名 ZIP
        shell: pwsh
        run: ./scripts/package.ps1 -Release -CertificateThumbprint '${{ steps.certificate.outputs.thumbprint }}'
      - name: 移除临时证书
        if: always() && steps.certificate.outputs.thumbprint != ''
        shell: pwsh
        run: Remove-Item -LiteralPath 'Cert:\CurrentUser\My\${{ steps.certificate.outputs.thumbprint }}' -Force
      - name: 为正式发布件生成 GitHub 来源证明
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            dist/*.zip
            dist/checksums.txt
      - name: 创建 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem dist -File | Where-Object { $_.Extension -eq '.zip' -or $_.Name -eq 'checksums.txt' } | ForEach-Object FullName)
          if ($assets.Count -lt 2) { throw '正式发布资产不完整' }
          & gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            $isPrerelease = (& gh release view $env:GITHUB_REF_NAME --json isPrerelease --jq '.isPrerelease').Trim()
            if ($isPrerelease -ne 'true') { throw '已存在的正式 Release 不能由未复验工作流覆盖' }
            $arguments = @('release', 'upload', $env:GITHUB_REF_NAME) + $assets + @('--clobber')
          }
          else {
            $arguments = @('release', 'create', $env:GITHUB_REF_NAME) + $assets + @('--verify-tag', '--generate-notes', '--title', $env:GITHUB_REF_NAME, '--prerelease')
          }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release 创建失败' }
